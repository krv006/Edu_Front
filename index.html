<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/shared/assets/y-logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6957e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101019" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Fokus — o‘qituvchilar uchun zamonaviy ta’lim va muloqot maydoni."
    />
    <title>YolUp</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("fokus_theme");
          var mode = stored ? JSON.parse(stored).state.mode : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          void error;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
